# =============================================================================
# devops-pipeline.yml — GitHub Actions CI/CD Pipeline
# Stages: Lint → SonarQube → Docker Build+Test → Terraform Plan
# =============================================================================
name: DevOps Pipeline — DCKAP Hospital Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-south-1
  DOCKER_IMAGE: krishnajune2000/hospital-app
  TF_VERSION: 1.6.6

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint & Validate
  # ---------------------------------------------------------------------------
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python linting tools
        run: pip install flake8 bandit

      - name: Flake8 — Python code style check
        run: flake8 app/ scripts/ --max-line-length=120 --ignore=E501

      - name: Bandit — Python security scan (OWASP)
        run: bandit -r app/ scripts/ -ll

      - name: ShellCheck — Bash script linting
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (local backend for validate)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: tfsec — Terraform Security & Compliance Scan
        uses: aquasecurity/tfsec-action@master
        with:
          working_directory: terraform
          soft_fail: true

      - name: Checkov — Infrastructure Policy-as-Code Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: terraform
          soft_fail: true
          output_format: cli

  # ---------------------------------------------------------------------------
  # Stage 2: SonarQube Cloud Security Scan
  # ---------------------------------------------------------------------------
  sonarqube-scan:
    name: SonarQube Security Gate
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SonarQube blame analysis

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=kris-2000_aws-terraform-soc2-devops-platform
            -Dsonar.organization=kris-2000
            -Dsonar.sources=app,scripts,terraform,k8s
            -Dsonar.python.version=3.12

  # ---------------------------------------------------------------------------
  # Stage 3: Docker Build & Health Test
  # ---------------------------------------------------------------------------
  docker-build-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./app
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest

      - name: Start container and test /health endpoint
        run: |
          docker run -d --name hospital-test -p 8000:8000 ${{ env.DOCKER_IMAGE }}:latest
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          echo "Health endpoint returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Health check failed with status $HTTP_STATUS"
            docker logs hospital-test
            exit 1
          fi
          echo "Health check passed!"

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

  # ---------------------------------------------------------------------------
  # Stage 4: Terraform Plan (read-only, never applies in CI)
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [sonarqube-scan, docker-build-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::432004895733:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Plan (dry-run only — never apply in CI)
        run: terraform plan -var="db_password=PLACEHOLDER" -no-color
        working-directory: terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
